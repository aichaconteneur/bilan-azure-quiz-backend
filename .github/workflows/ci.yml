name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: acrazuretechdev
  IMAGE_NAME: quiz-backend
  RESOURCE_GROUP: aidialloRG
  APP_SERVICE_NAME: app-azuretech-dev

jobs:
  build:
    name: Build, Test and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: az account show --output table

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Tag Docker image
        run: |
          docker tag $IMAGE_NAME:latest $ACR_NAME.azurecr.io/$IMAGE_NAME:latest
          docker tag $IMAGE_NAME:latest $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Push Docker images
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Configure App Service container
        run: |
          az webapp config container set \
            --resource-group $RESOURCE_GROUP \
            --name $APP_SERVICE_NAME \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group $RESOURCE_GROUP \
            --name $APP_SERVICE_NAME
